                  <span className={`text-xs truncate ${isActive ? 'text-white/80' : isCompleted ? 'text-[#394551]/70' : 'text-gray-500'}`}>{step.description}</span>
                </div>
              </>
            )}
          </div>
          {step.type === 'condition' && step.conditionLabel && (
            <div className={`text-xs font-medium px-3 py-1 rounded-full mt-1 ${isActive || isCompleted ? 'bg-[#CEFB62]/20 text-[#394551]' : 'bg-gray-100 text-gray-600'}`}>
              {step.conditionLabel}
            </div>
          )}
        </div>
      );
    };

    // ============ Connector Components ============
    const Connector = ({ isActive, isCompleted }) => (
      <div className="flex items-center gap-2">
        <div className={`h-0.5 w-12 ${isCompleted || isActive ? 'bg-[#CEFB62]' : 'bg-gray-300'}`} />
        <span className={isCompleted || isActive ? 'text-[#CEFB62]' : 'text-gray-400'}><Icons.ArrowRight /></span>
      </div>
    );

    const VerticalConnector = ({ isActive, isCompleted }) => (
      <div className={`h-8 w-0.5 ${isCompleted ? 'bg-[#CEFB62]' : isActive ? 'bg-[#5A69E0]' : 'bg-gray-300'}`} />
    );

    // ============ Branch Section Component ============
    const BranchSection = ({ conditionStep, yesSteps, noSteps, currentStepIndex, steps, onRenderStep, ui }) => {
      const conditionIndex = steps.findIndex(s => s.id === conditionStep.id);
      const yesIndices = yesSteps.map(s => steps.findIndex(s2 => s2.id === s.id));
      const noIndices = noSteps.map(s => steps.findIndex(s2 => s2.id === s.id));
      
      const conditionState = currentStepIndex > conditionIndex
        ? { isActive: false, isCompleted: true, isPending: false }
        : currentStepIndex === conditionIndex
        ? { isActive: true, isCompleted: false, isPending: false }
        : { isActive: false, isCompleted: false, isPending: true };

      const getBranchStepState = (stepIndex) => {
        if (currentStepIndex > stepIndex) return { isActive: false, isCompleted: true, isPending: false };
        if (currentStepIndex === stepIndex) return { isActive: true, isCompleted: false, isPending: false };
        if (currentStepIndex <= conditionIndex) return { isActive: false, isCompleted: false, isPending: true };
        return { isActive: false, isCompleted: false, isPending: true };
      };

      const maxYesSteps = yesSteps.length;
      const maxNoSteps = noSteps.length;
      const maxSteps = Math.max(maxYesSteps, maxNoSteps);
      
      const nodeHeight = 80;
      const branchHeight = Math.max(maxSteps * nodeHeight, 0);

      return (
        <div className="flex flex-col items-center">
          <WorkflowNode
            step={conditionStep}
            isActive={conditionState.isActive}
            isCompleted={conditionState.isCompleted}
            isPending={conditionState.isPending}
            index={conditionIndex}
          />

          <div className="relative" style={{ minHeight: `${branchHeight + 60}px` }}>
            <div className="absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-2">
              <div className={`w-3 h-3 rounded-full ${conditionState.isCompleted ? 'bg-[#CEFB62]' : conditionState.isActive ? 'bg-[#5A69E0]' : 'bg-gray-300'}`} />
            </div>

            <div className="absolute top-0 left-1/2 transform -translate-x-1/2" style={{ height: '30px' }}>
              <div 
                className="absolute left-1/2 top-0 w-0.5 h-8 origin-top"
                style={{ 
                  transform: 'translateX(-50%) rotate(25deg)',
                  background: conditionState.isCompleted || conditionState.isActive ? '#CEFB62' : '#d1d5db'
                }}
              />
              <div 
                className="absolute left-1/2 top-0 w-0.5 h-8 origin-top"
                style={{ 
                  transform: 'translateX(-50%) rotate(-25deg)',
                  background: conditionState.isCompleted || conditionState.isActive ? '#CEFB62' : '#d1d5db'
                }}
              />
            </div>

            <div className="flex items-start gap-16 pt-10" style={{ minHeight: `${branchHeight}px` }}>
              <div className="flex flex-col items-center flex-1 max-w-[220px]">
                <div className={`text-xs font-medium px-3 py-1 rounded-full mb-4 ${conditionState.isCompleted ? 'bg-[#5A69E0] text-white' : conditionState.isActive ? 'bg-[#5A69E0]/20 text-[#5A69E0]' : 'bg-gray-100 text-gray-500'}`}>
                  {ui.yes}
                </div>
                
                {yesSteps.length > 0 ? (
                  <div className="flex flex-col items-center gap-2">
                    {yesSteps.map((step, idx) => {
                      const stepIndex = steps.findIndex(s => s.id === step.id);
                      const state = getBranchStepState(stepIndex);
                      return (
                        <React.Fragment key={step.id}>
                          <WorkflowNode
                            step={step}
                            isActive={state.isActive}
                            isCompleted={state.isCompleted}
                            isPending={state.isPending}
                            index={stepIndex}
                          />
                          {idx < yesSteps.length - 1 && (
                            <div className={`h-8 w-0.5 ${state.isCompleted ? 'bg-[#CEFB62]' : 'bg-gray-300'}`} />
                          )}
                        </React.Fragment>
                      );
                    })}
                  </div>
                ) : (
                  <div className={`text-xs px-3 py-2 rounded-lg border ${conditionState.isCompleted ? 'border-[#CEFB62] bg-[#CEFB62]/10 text-gray-600' : 'border-gray-200 bg-gray-50 text-gray-400'}`}>
                    {ui.noFurther}
                  </div>
                )}
              </div>

              <div className="flex flex-col items-center flex-1 max-w-[220px]">
                <div className={`text-xs font-medium px-3 py-1 rounded-full mb-4 ${conditionState.isCompleted ? 'bg-gray-500 text-white' : conditionState.isActive ? 'bg-gray-200 text-gray-600' : 'bg-gray-100 text-gray-500'}`}>
                  {ui.no}
                </div>
                
                {noSteps.length > 0 ? (
                  <div className="flex flex-col items-center gap-2">
                    {noSteps.map((step, idx) => {
                      const stepIndex = steps.findIndex(s => s.id === step.id);
                      const state = getBranchStepState(stepIndex);
                      return (
                        <React.Fragment key={step.id}>
                          <WorkflowNode
                            step={step}
                            isActive={state.isActive}
                            isCompleted={state.isCompleted}
                            isPending={state.isPending}
                            index={stepIndex}
                          />
                          {idx < noSteps.length - 1 && (
                            <div className={`h-8 w-0.5 ${state.isCompleted ? 'bg-[#CEFB62]' : 'bg-gray-300'}`} />
                          )}
                        </React.Fragment>
                      );
                    })}
                  </div>
                ) : (
                  <div className={`text-xs px-3 py-2 rounded-lg border ${conditionState.isCompleted ? 'border-[#CEFB62] bg-[#CEFB62]/10 text-gray-600' : 'border-gray-200 bg-gray-50 text-gray-400'}`}>
                    {ui.noFurther}
                  </div>
                )}
              </div>
            </div>

            {yesSteps.length > 0 || noSteps.length > 0 ? (
              <div className="absolute bottom-0 left-1/2 transform -translate-x-1/2 translate-y-2" style={{ minWidth: '200px' }}>
                <div className="flex justify-center">
                  <div 
                    className="h-0.5"
                    style={{ 
                      width: '100%',
                      background: conditionState.isCompleted ? '#CEFB62' : '#d1d5db'
                    }}
                  />
                </div>
                <div 
                  className="absolute left-1/2 transform -translate-x-1/2 -top-1 w-3 h-3 rounded-full"
                  style={{ 
                    background: conditionState.isCompleted ? '#CEFB62' : '#d1d5db'
                  }}
                />
              </div>
            ) : (
              <div className="absolute bottom-0 left-1/2 transform -translate-x-1/2 translate-y-2">
                <div 
                  className="w-3 h-3 rounded-full"
                  style={{ 
                    background: conditionState.isCompleted ? '#CEFB62' : '#d1d5db'
                  }}
                />
              </div>
            )}
          </div>
        </div>
      );
    };

    // ============ Parse Steps ============
    const parseStepsToSections = (steps) => {
      const sections = [];
      let i = 0;
      
      while (i < steps.length) {
        const step = steps[i];
        
        if (step.type === 'condition') {
          const yesBranch = [];
          const noBranch = [];
          i++;
          
          while (i < steps.length && steps[i].branchType === 'yes') {
            yesBranch.push(steps[i]);
            i++;
          }
          
          while (i < steps.length && steps[i].branchType === 'no') {
            noBranch.push(steps[i]);
            i++;
          }
          
          sections.push({ 
            type: 'branch', 
            condition: step, 
            yesBranch, 
            noBranch 
          });
        } else {
          sections.push({ type: 'linear', step });
          i++;
        }
      }
      
      return sections;
    };

    // ============ Message Card Component ============
    const MessageCard = ({ message, index, lang, ui }) => {
      const colors = channelColors[message.channel];
      const IconComp = channelIcons[message.channel];
      const name = channelNameSets[lang][message.channel];

      const formatTime = (date) => {
        return date.toLocaleTimeString(lang === 'cn' ? 'zh-CN' : 'en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      };

      if (message.channel === 'email') {
        return (
          <div className="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden animate-slide-in" style={{ animationDelay: `${index * 0.1}s` }}>
            <div className="bg-gradient-to-r from-[#5A69E0] to-[#3D4DB7] px-4 py-3">
              <div className="flex items-center gap-2 text-white">
                <IconComp />
                <span className="font-semibold text-sm">{name}</span>
                <span className="ml-auto text-xs opacity-80">{formatTime(message.timestamp)}</span>
              </div>
            </div>
            <div className="p-4">
              <h4 className="font-semibold text-[#394551] mb-2">{message.content.subject}</h4>
              <p className="text-sm text-gray-600 mb-3 leading-relaxed whitespace-pre-line">
                {message.content.body.split('\n').slice(0, 3).join('\n')}
              </p>
              {message.content.preview && (
                <div className="bg-gray-50 rounded-lg p-3 border-l-4 border-[#5A69E0]">
                  <p className="text-xs text-gray-500 italic">{message.content.preview}</p>
                </div>
              )}
            </div>
          </div>
        );
      }

      if (message.channel === 'whatsapp') {
        return (
          <div className="bg-[#ECE5DD] rounded-xl p-4 shadow-lg animate-slide-in" style={{ animationDelay: `${index * 0.1}s` }}>
            <div className="flex items-center gap-2 mb-2">
              <div className={`${colors.bg} p-1.5 rounded-full`}>
                <span className={colors.icon}><IconComp /></span>
              </div>
              <span className="font-semibold text-sm text-gray-800">{name}</span>
              <span className="ml-auto text-xs text-gray-500">{formatTime(message.timestamp)}</span>
            </div>
            <div className="bg-white rounded-lg rounded-tl-none p-3 shadow-sm">
              <p className="text-sm text-gray-800 whitespace-pre-line leading-relaxed">{message.content.body}</p>
            </div>
          </div>
        );
      }

      if (message.channel === 'app_push' || message.channel === 'web_push') {
        const isWeb = message.channel === 'web_push';
        return (
          <div className="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden animate-slide-in" style={{ animationDelay: `${index * 0.1}s` }}>
            <div className="bg-[#394551] px-4 py-2 flex items-center gap-2">
              <div className="flex gap-1">
                <div className="w-2 h-2 rounded-full bg-red-500" />
                <div className="w-2 h-2 rounded-full bg-yellow-500" />
                <div className="w-2 h-2 rounded-full bg-green-500" />
              </div>
              <span className="text-xs text-gray-400 ml-2">{isWeb ? ui.browserNotif : ui.appNotif}</span>
            </div>
            <div className="p-3 flex items-start gap-3">
              <div className={`${colors.bg} p-2 rounded-lg`}>
                <span className={colors.icon}><IconComp /></span>
              </div>
              <div className="flex-1 min-w-0">
                <div className="flex items-center justify-between mb-1">
                  <span className="font-semibold text-sm text-[#394551]">{message.content.title}</span>
                  <span className="text-xs text-gray-400">{formatTime(message.timestamp)}</span>
                </div>
                <p className="text-sm text-gray-600 truncate">{message.content.body}</p>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="bg-white rounded-xl shadow-lg border border-gray-200 p-4 animate-slide-in" style={{ animationDelay: `${index * 0.1}s` }}>
          <div className="flex items-center gap-2 mb-3">
            <div className={`${colors.bg} p-1.5 rounded-full`}>
              <span className={colors.icon}><IconComp /></span>
            </div>
            <span className="font-semibold text-sm text-gray-800">{name}</span>
            <span className="ml-auto text-xs text-gray-500">{formatTime(message.timestamp)}</span>
          </div>
          <p className="text-sm text-gray-700 leading-relaxed mb-3 whitespace-pre-line">{message.content.body}</p>
          <p className="text-xs text-gray-400 italic">{ui.replyT}</p>
        </div>
      );
    };

    // ============ Scenario Card Component ============
    const ScenarioCard = ({ scenario, isActive, isPlaying, onClick }) => {
      const IconComp = Icons[scenario.icon] || Icons.Zap;
      return (
        <button
          onClick={onClick}
          className={`
            relative overflow-hidden rounded-xl p-4 text-left transition-all duration-300 cursor-pointer hover:-translate-y-0.5
            ${isActive
              ? `bg-gradient-to-br ${scenario.bgGradient} text-white shadow-xl ring-2 ring-white/30`
              : 'bg-white shadow-sm border border-gray-200 text-[#394551] hover:border-[#5A69E0]/50'
            }
          `}
        >
          <div className={`w-10 h-10 rounded-lg mb-3 flex items-center justify-center ${isActive ? 'bg-white/20' : 'bg-[#5A69E0]/10'}`}>
            <span className={isActive ? 'text-white' : 'text-[#5A69E0]'}><IconComp /></span>
          </div>
          <h3 className="font-semibold text-sm mb-1">{scenario.name}</h3>
          <p className={`text-xs ${isActive ? 'text-white/80' : 'text-gray-500'}`}>
            {scenario.userSegment}
          </p>
        </button>
      );
    };

    // ============ Main Component ============
    const EngageLabMASimulator = () => {
      const [lang, setLang] = useState('en');
      const isCn = lang === 'cn';
      const locale = isCn ? 'zh-CN' : 'en-US';
      const SCEN = isCn ? scenariosZh : scenariosEn;
      const UI = UIS[lang];
      const [activeScenarioId, setActiveScenarioId] = useState(null);
      const [currentStepIndex, setCurrentStepIndex] = useState(-1);
      const [messages, setMessages] = useState([]);
      const [isPlaying, setIsPlaying] = useState(false);
      const [isCompleted, setIsCompleted] = useState(false);

      const activeScenario = SCEN.find(s => s.id === activeScenarioId);

      useEffect(() => {
        document.documentElement.lang = isCn ? 'zh-CN' : 'en';
        document.title = isCn ? 'EngageLab MA · 客户全生命周期自动化演示' : 'EngageLab MA · Customer Lifecycle Automation Demo';
        resetSimulation();
      }, [lang]);

      const resetSimulation = useCallback(() => {
        setCurrentStepIndex(-1);
        setMessages([]);
        setIsPlaying(false);
        setIsCompleted(false);
      }, []);

      const startScenario = useCallback((scenarioId) => {
        resetSimulation();
        setActiveScenarioId(scenarioId);
        setIsPlaying(true);
      }, [resetSimulation]);

      useEffect(() => {
        if (!isPlaying || !activeScenario) return;

        if (currentStepIndex === -1) {
          const timer = setTimeout(() => setCurrentStepIndex(0), 500);
          return () => clearTimeout(timer);
        }

        if (currentStepIndex >= activeScenario.steps.length) {
          setIsPlaying(false);
          setIsCompleted(true);
          return;
        }

        const currentStep = activeScenario.steps[currentStepIndex];

        if (currentStep.branchType === 'no') {
          const prevStep = currentStepIndex > 0 ? activeScenario.steps[currentStepIndex - 1] : null;
          if (prevStep && (prevStep.type === 'condition' || prevStep.branchType === 'yes')) {
            setMessages(prev => prev.filter(msg => {
              return !activeScenario.steps.some(s => 
                s.branchType === 'yes' && s.id === msg.stepId
              );
            }));
          }
        }

        if (currentStep.channel && currentStep.message) {
          const newMessage = {
            id: `${currentStep.id}-${Date.now()}`,
            channel: currentStep.channel,
            content: currentStep.message,
            timestamp: new Date(),
            stepId: currentStep.id,
          };
          setMessages(prev => [...prev, newMessage]);
        }

        const timer = setTimeout(() => setCurrentStepIndex(prev => prev + 1), 1500);
        return () => clearTimeout(timer);
      }, [isPlaying, currentStepIndex, activeScenario]);

      const getStepState = (index) => {
        if (!activeScenario) return { isActive: false, isCompleted: false, isPending: true };
        if (currentStepIndex > index) return { isActive: false, isCompleted: true, isPending: false };
        if (currentStepIndex === index) return { isActive: true, isCompleted: false, isPending: false };
        return { isActive: false, isCompleted: false, isPending: true };
      };

      const getSegmentBadgeColor = (color) => {
        const colors = {
          purple: 'bg-[#5A69E0]/10 text-[#5A69E0] border-[#5A69E0]/30',
          emerald: 'bg-emerald-500/10 text-emerald-600 border-emerald-500/30',
          violet: 'bg-violet-500/10 text-violet-600 border-violet-500/30',
          orange: 'bg-orange-500/10 text-orange-600 border-orange-500/30',
          slate: 'bg-slate-500/10 text-slate-600 border-slate-500/30',
          amber: 'bg-amber-500/10 text-amber-600 border-amber-500/30',
        };
        return colors[color] || colors.purple;
      };

      const renderWorkflowContent = () => {
        if (!activeScenario) return null;

        const sections = parseStepsToSections(activeScenario.steps);
        const steps = activeScenario.steps;

        return (
          <div className="flex flex-col items-center">
            <div className="text-center mb-8">
              <h3 className="text-[#394551] text-xl font-bold">{activeScenario.name}</h3>
              <p className="text-gray-500 text-sm mt-1">{activeScenario.description}</p>
              <div className={`inline-flex items-center gap-2 mt-3 px-3 py-1.5 rounded-full text-xs font-medium border ${getSegmentBadgeColor(activeScenario.color)}`}>
                <Icons.Users />
                {activeScenario.userSegment}
              </div>
            </div>

            <div className="flex flex-col items-center gap-0">
              {sections.map((section, sectionIdx) => {
                if (section.type === 'linear') {
                  const stepIndex = steps.findIndex(s => s.id === section.step.id);
                  const { isActive, isCompleted, isPending } = getStepState(stepIndex);
                  
                  return (
                    <React.Fragment key={section.step.id}>
                      {sectionIdx > 0 && (
                        <VerticalConnector isActive={isActive} isCompleted={isCompleted} />
                      )}
                      <WorkflowNode
                        step={section.step}
                        isActive={isActive}
                        isCompleted={isCompleted}
                        isPending={isPending}
                        index={stepIndex}
                      />
                    </React.Fragment>
                  );
                } else if (section.type === 'branch') {
                  return (
                    <React.Fragment key={section.condition.id}>
                      {sectionIdx > 0 && (
                        <VerticalConnector 
                          isActive={getStepState(steps.findIndex(s => s.id === section.condition.id)).isActive} 
                          isCompleted={getStepState(steps.findIndex(s => s.id === section.condition.id)).isCompleted} 
                        />
                      )}
                      <BranchSection
                        conditionStep={section.condition}
                        yesSteps={section.yesBranch}
                        noSteps={section.noBranch}
                        currentStepIndex={currentStepIndex}
                        steps={steps}
                        ui={UI}
                      />
                    </React.Fragment>
                  );
                }
                return null;
              })}
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-[#f8f9fc] via-[#eef0fd] to-[#f8f9fc] pb-12">
          <header className="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
            <div className="px-8 py-6">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-4">
                  <img 
                    src="https://img.engagelab.net/en/article/engageLab-logo-compressed.webp" 
                    alt="EngageLab Logo"
                    onError={(e)=>{ e.target.style.display='none'; const d=document.getElementById('logo-fallback'); if(d)d.style.display='flex'; }}
                    className="h-9 w-auto object-contain"
                  />
                  <div id="logo-fallback" style={{display:'none'}} className="h-9 px-3 rounded-lg bg-gradient-to-r from-[#5A69E0] to-[#3D4DB7] text-white font-bold text-sm items-center shadow-sm">EngageLab</div>
                  <div>
                    <h1 className="text-2xl font-bold text-[#394551]">EngageLab MA</h1>
                    <p className="text-sm text-[#5A69E0]">{UI.subtitle}</p>
                  </div>
                </div>
                <div className="flex items-center gap-4">
                  <button
                    onClick={() => setLang(l => (l === 'en' ? 'cn' : 'en'))}
                    className="flex items-center gap-1.5 rounded-full border border-[#5A69E0]/30 bg-white px-3 py-2 text-sm font-semibold text-[#5A69E0] hover:bg-[#5A69E0]/5 transition-colors shadow-sm"
                    aria-label="Switch language"
                  >
                    <Icons.Globe />
                    <span>{isCn ? 'EN' : '中文'}</span>
                  </button>
                  <div className="flex items-center gap-2 bg-[#CEFB62]/20 border border-[#CEFB62]/30 rounded-full px-4 py-2">
                    <span className="w-2 h-2 bg-[#CEFB62] rounded-full animate-pulse" />
                    <span className="text-[#394551] text-sm font-medium">{UI.systemRunning}</span>
                  </div>
                  <div className="text-right">
                    <p className="text-[#394551] font-medium">{new Date().toLocaleDateString(locale)}</p>
                    <p className="text-gray-500 text-xs">{UI.liveDemo}</p>
                  </div>
                </div>
              </div>
            </div>
          </header>

          <div className="px-8 py-6">
            <div className="flex items-center gap-2 mb-4">
              <span className="text-[#5A69E0]"><Icons.Users /></span>
              <span className="text-[#394551] text-sm font-medium">{UI.selectScenario}</span>
            </div>
            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
              {SCEN.map((scenario) => (
                <ScenarioCard
                  key={scenario.id}
                  scenario={scenario}
                  isActive={activeScenarioId === scenario.id}
                  isPlaying={isPlaying}
                  onClick={() => startScenario(scenario.id)}
                />
              ))}
            </div>
          </div>

          <div className="px-8 pb-8" style={{ height: 'calc(100vh - 200px)' }}>
            <div className="flex flex-col lg:flex-row gap-6 h-full">
              <div className="flex-1 bg-white shadow-lg rounded-2xl border border-gray-200 overflow-hidden flex flex-col">
                <div className="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-[#5A69E0] to-[#3D4DB7] flex items-center justify-center">
                      <span className="text-white"><Icons.TrendingUp /></span>
                    </div>
                    <div>
                      <h2 className="text-[#394551] font-semibold">{UI.engineTitle}</h2>
                      <p className="text-gray-500 text-xs">{UI.engineSub}</p>
                    </div>
                  </div>
                  {activeScenario && (
                    <div className="flex items-center gap-3">
                      {isPlaying && (
                        <div className="flex items-center gap-2 bg-[#5A69E0]/10 border border-[#5A69E0]/30 rounded-full px-3 py-1.5">
                          <span className="text-[#5A69E0] animate-spin-custom"><Icons.RefreshCw /></span>
                          <span className="text-[#5A69E0] text-xs">{UI.executing}</span>
                        </div>
                      )}
                      {isCompleted && (
                        <div className="flex items-center gap-2 bg-[#CEFB62]/20 border border-[#CEFB62]/30 rounded-full px-3 py-1.5">
                          <span className="text-[#394551]"><Icons.Check /></span>
                          <span className="text-[#394551] text-xs">{UI.completed}</span>
                        </div>
                      )}
                      <button
                        onClick={resetSimulation}
                        className="text-gray-400 hover:text-[#394551] transition-colors"
                      >
                        <Icons.RefreshCw />
                      </button>
                    </div>
                  )}
                </div>

                <div className="p-8 flex-1 overflow-y-auto scrollbar-hide">
                  {!activeScenario ? (
                    <div className="h-full flex flex-col items-center justify-center text-center py-12">
                      <div className="w-20 h-20 rounded-2xl bg-[#5A69E0]/5 flex items-center justify-center mb-4">
                        <span className="text-gray-400"><Icons.Sparkles /></span>
                      </div>
                      <h3 className="text-[#394551] text-lg font-medium mb-2">{UI.emptyTitle}</h3>
                      <p className="text-gray-500 text-sm max-w-md">
                        {UI.emptyBody}
                      </p>
                    </div>
                  ) : (
                    renderWorkflowContent()
                  )}
                </div>
              </div>

              <div className="w-full lg:w-[420px] bg-white shadow-lg rounded-2xl border border-gray-200 overflow-hidden flex flex-col flex-shrink-0" style={{ maxHeight: '100%' }}>
                <div className="px-6 py-4 border-b border-gray-200 flex items-center gap-3">
                  <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-[#CEFB62] to-[#a8d94a] flex items-center justify-center">
                    <span className="text-[#394551]"><Icons.MessageCircle /></span>
                  </div>
                  <div>
                    <h2 className="text-[#394551] font-semibold">{UI.streamTitle}</h2>
                    <p className="text-gray-500 text-xs">{UI.streamSub}</p>
                  </div>
                  <div className="ml-auto">
                    <span className="text-2xl font-bold text-[#394551]">{messages.length}</span>
                    <span className="text-gray-500 text-xs ml-1">{UI.msgUnit}</span>
                  </div>
                </div>

                <div className="p-4 flex-1 overflow-y-auto scrollbar-hide space-y-4">
                  {messages.length === 0 ? (
                    <div className="h-full flex flex-col items-center justify-center text-center py-12">
                      <div className="w-16 h-16 rounded-2xl bg-[#5A69E0]/5 flex items-center justify-center mb-4">
                        <span className="text-gray-400"><Icons.Mail /></span>
                      </div>
                      <h3 className="text-[#394551] font-medium mb-2">{UI.noMsgTitle}</h3>
                      <p className="text-gray-500 text-sm">
                        {UI.noMsgBody}
                      </p>
                      <div className="mt-6 flex flex-wrap items-center justify-center gap-4">
                        <div className="flex items-center gap-2 text-gray-500">
                          <Icons.Mail />
                          <span className="text-xs">{UI.legendEmail}</span>
                        </div>
                        <div className="flex items-center gap-2 text-gray-500">
                          <Icons.MessageCircle />
                          <span className="text-xs">WhatsApp</span>
                        </div>
                        <div className="flex items-center gap-2 text-gray-500">
                          <Icons.Smartphone />
                          <span className="text-xs">SMS</span>
                        </div>
                        <div className="flex items-center gap-2 text-gray-500">
                          <Icons.Bell />
                          <span className="text-xs">{UI.legendPush}</span>
                        </div>
                      </div>
                    </div>
                  ) : (
                    messages.map((message, index) => (
                      <MessageCard key={message.id} message={message} index={index} lang={lang} ui={UI} />
                    ))
                  )}
                </div>
              </div>
            </div>
          </div>

          <div className="fixed bottom-0 left-0 right-0 bg-white shadow-sm border-t border-gray-200 px-8 py-3">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-6">
                <div className="flex items-center gap-2">
                  <div className="w-2 h-2 rounded-full bg-[#CEFB62]" />
                  <span className="text-gray-500 text-xs">{UI.engineRunning}</span>
                </div>
                <div className="hidden md:flex items-center gap-4 text-xs text-gray-500">
                  <span>{UI.legendEmail}</span>
                  <span className="w-1 h-1 rounded-full bg-gray-400" />
                  <span>WhatsApp</span>
                  <span className="w-1 h-1 rounded-full bg-gray-400" />
                  <span>SMS</span>
                  <span className="w-1 h-1 rounded-full bg-gray-400" />
                  <span>App Push</span>
                  <span className="w-1 h-1 rounded-full bg-gray-400" />
                  <span>Web Push</span>
                </div>
              </div>
              <div className="text-gray-500 text-xs">
                {UI.footer}
              </div>
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<EngageLabMASimulator />);
  </script>


</body></html>
